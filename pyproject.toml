[project]
name = "marathon"
version = "0.1.0"
description = "Driver for the Aristotle (Harmonic) automated theorem proving API. Submits Lean / TeX projects in dependency order."
requires-python = ">=3.11"
dependencies = [
    # 2.0 split Project's end-to-end wait_for_completion into Project +
    # AgentTask + Event; marathon.aristotle_runtime wraps that back into
    # Marathon's lifecycle shape.
    "aristotlelib>=2.0.0",
    # Used by marathon.formalization to maintain formalization.yaml
    # (mathlib-initiative v0.2 schema). Pinned to PyYAML 6+ for the
    # safe_load / safe_dump API used in the module.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
# Exposes a ``marathon`` console script. After ``uv tool install
# /path/to/marathon`` (or ``pipx install -e .``), ``marathon review ...``
# is on PATH and the review shims at <repo>/.marathon/review/*.py
# dispatch to it cleanly.
marathon = "marathon.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the marathon/ package AND its prompts/ subdirectory.
# `packages = ["marathon"]` recurses, so prompts/*.md ride along
# automatically. An earlier version also had a
# `[tool.hatch.build.targets.wheel.force-include]` entry redundantly
# re-adding marathon/prompts; removed because hatchling now errors
# on duplicate file inclusion.
packages = ["marathon"]
